openapi: 3.1.0
info:
  title: OpenAstroLink API
  version: 0.2.6
  description: Reference API exposed by OpenAstroSuite. Native OpenAstroLink ABI-v2 drivers are the preferred hardware path; INDI/Alpaca/LX200 remain compatibility adapters.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /node/info:
    get:
      summary: Headless node identity and event endpoint metadata
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /node/backends:
    get:
      summary: Backends available on this node
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /drivers:
    get:
      summary: Native OpenAstroLink driver registry
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /drivers/devices:
    get:
      summary: Devices discovered directly by native OAL drivers
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /drivers/{driverId}/devices/{deviceId}/capabilities:
    get:
      summary: Typed capabilities reported by one native OAL device
      parameters:
        - in: path
          name: driverId
          required: true
          schema: { type: string }
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Success' }
  /profile:
    get:
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /devices/connect:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, backend]
              properties:
                type: { type: string, enum: [camera, mount, focuser] }
                backend: { type: string }
                endpoint: { type: string }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /devices/{type}/disconnect:
    post:
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [camera, mount, focuser] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Success' }
  /devices/disconnect-all:
    post:
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Success' }
  /operations:
    get:
      summary: List operation resources, newest first
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /operations/active:
    get:
      summary: List queued/running operations
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /operations/{id}:
    get:
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Success' }
  /operations/{id}/cancel:
    post:
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Success' }
  /solver/select:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /solver/catalog:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /solver/model:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /devices:
    get:
      summary: List connected/exported devices
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /state:
    get:
      summary: Current aggregate observatory state
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mounts/{id}/status:
    get:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/slew:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquatorialCoord' }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/abort:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/sync:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquatorialCoord' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /focusers/{id}/status:
    get:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /focusers/{id}/move:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties: { position: { type: integer, minimum: 0 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /cameras/{id}/capture:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExposureRequest' }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /frames/{id}/preview:
    get:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      summary: Fetch PNG preview for a recently captured frame
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Success' }
  /solve:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hintRaDeg: { type: number, minimum: 0, maximum: 360 }
                hintDecDeg: { type: number, minimum: -90, maximum: 90 }
                hintFovDeg: { type: number, exclusiveMinimum: 0 }
                searchRadiusDeg: { type: number, exclusiveMinimum: 0 }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /autofocus/{id}/run:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutofocusRequest' }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /motion/estimate:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /observer/system-location:
    post: { responses: { '202': { $ref: '#/components/responses/Success' } } }
  /guider/default/start:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /guider/default/stop:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /guider/default/update:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /guider/default/status:
    get: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /polar-align/clear:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /polar-align/sample:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /polar-align/ra-offset:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deltaDeg]
              properties: { deltaDeg: { type: number } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /polar-align/estimate:
    get: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /sessions:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /sessions/current:
    get: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /sessions/current/stop:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
components:
  parameters:
    OperationId:
      in: path
      name: id
      required: true
      schema: { type: string }
    DeviceId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    EquatorialCoord:
      type: object
      required: [raDeg, decDeg]
      properties:
        raDeg: { type: number, minimum: 0, maximum: 360 }
        decDeg: { type: number, minimum: -90, maximum: 90 }
    ExposureRequest:
      type: object
      properties:
        exposureSec: { type: number, exclusiveMinimum: 0, default: 1 }
        binX: { type: integer, minimum: 1, default: 1 }
        binY: { type: integer, minimum: 1, default: 1 }
        gain: { type: integer, default: 0 }
        offset: { type: integer, default: 0 }
        includeImage: { type: boolean, default: true }
    AutofocusRequest:
      type: object
      properties:
        mode: { type: string, enum: [stars, planet, bahtinov], default: stars }
        rangeSteps: { type: integer, minimum: 100, default: 1600 }
        coarseStep: { type: integer, minimum: 1, default: 200 }
        fineStep: { type: integer, minimum: 1, default: 40 }
        framesPerPosition: { type: integer, minimum: 1, default: 3 }
        settleMs: { type: integer, minimum: 0, default: 400 }
        autoPlanetRoi: { type: boolean, default: true }
    SessionRequest:
      type: object
      required: [name, targets]
      properties:
        name: { type: string }
        targets:
          type: array
          items:
            type: object
            required: [name, raDeg, decDeg]
            properties:
              name: { type: string }
              raDeg: { type: number }
              decDeg: { type: number }
              exposureSec: { type: number, default: 30 }
              repeats: { type: integer, default: 1 }
              filter: { type: string }
    Operation:
      type: object
      required: [id, kind, state, progress, cancelSupported, resourceLocks]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        phase: { type: string }
        cancelSupported: { type: boolean }
        cancelRequested: { type: boolean }
        resourceLocks:
          type: array
          items: { type: string }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
        startedAtUtc: { type: string, format: date-time }
        finishedAtUtc: { type: string, format: date-time }
        progressDetail: { type: object }
        result: {}
        problem:
          oneOf:
            - type: 'null'
            - type: object
    Envelope:
      type: object
      required: [ok, error, data]
      properties:
        ok: { type: boolean }
        error:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
                details: {}
        data: {}
  responses:
    Success:
      description: Standard OAL envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
