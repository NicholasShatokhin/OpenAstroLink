openapi: 3.1.0
info:
  title: OpenAstroLink API
  version: 0.2.10.47
  description: Reference API exposed by OpenAstroSuite. Native OpenAstroLink ABI-v2 drivers are the preferred hardware path; INDI/Alpaca/LX200 remain compatibility adapters.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /node/info:
    get:
      summary: Headless node identity and event endpoint metadata
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /node/backends:
    get:
      summary: Backends available on this node
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /drivers:
    get:
      summary: Native OpenAstroLink driver registry
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /drivers/devices:
    get:
      summary: Devices discovered directly by native OAL drivers
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /drivers/{driverId}/devices/{deviceId}/capabilities:
    get:
      summary: Typed capabilities reported by one native OAL device
      parameters:
        - in: path
          name: driverId
          required: true
          schema: { type: string }
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Success' }
  /profile:
    get:
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelescopeProfile' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /devices/connect:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, backend]
              properties:
                type: { type: string, enum: [camera, mount, focuser] }
                role: { type: string, enum: [main, guide], default: main }
                backend: { type: string }
                endpoint: { type: string }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /devices/{type}/disconnect:
    post:
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [camera, guide-camera, mount, focuser] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Success' }
  /devices/disconnect-all:
    post:
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Success' }
  /operations:
    get:
      summary: List operation resources, newest first
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /operations/active:
    get:
      summary: List queued/running operations
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /operations/{id}:
    get:
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Success' }
  /operations/{id}/cancel:
    post:
      parameters: [ { $ref: '#/components/parameters/OperationId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Success' }
  /solver/select:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /solver/catalog:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /solver/model:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /devices:
    get:
      summary: List connected/exported devices and reserved observatory-device placeholders
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /state:
    get:
      summary: Current aggregate observatory state
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /integrations/stellarium:
    get:
      summary: Stellarium Telescope Control bridge state
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      summary: Enable/disable the Stellarium mount-position/GOTO TCP bridge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                port: { type: integer, minimum: 1, maximum: 65535, default: 10000 }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/status:
    get:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/slew:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquatorialCoord' }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/abort:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/sync:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquatorialCoord' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/tracking:
    post:
      summary: Enable/disable mount tracking and select drive rate
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                rate: { type: string, enum: [sidereal, lunar, solar], default: sidereal }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /mounts/{id}/site-time:
    post:
      summary: Apply observatory site and UTC to a backend with writable site/time properties (notably Classic ASCOM)
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitudeDeg: { type: number, minimum: -90, maximum: 90 }
                longitudeDeg: { type: number, minimum: -180, maximum: 180 }
                elevationM: { type: number }
                utc: { type: string, format: date-time }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /focusers/{id}/status:
    get:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /focusers/{id}/move:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties: { position: { type: integer, minimum: 0 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /cameras/{id}/capture:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExposureRequest' }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /cameras/{id}/live-view:
    post:
      summary: Start continuous node-local operational preview (cancel the returned operation to stop)
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exposureSec: { type: number, minimum: 0.0001, maximum: 10, default: 0.05 }
                gain: { type: integer, minimum: 0, default: 100 }
                offset: { type: integer, minimum: 0, default: 0 }
                binX: { type: integer, minimum: 1, maximum: 4, default: 2 }
                binY: { type: integer, minimum: 1, maximum: 4, default: 2 }
                targetFps: { type: number, minimum: 0.2, maximum: 30, default: 5 }
                debayer:
                  type: boolean
                  default: false
                  description: Preview-only software debayer. Science FITS/RAW remains unchanged.
                bayerPattern:
                  type: string
                  enum: [AUTO, RGGB, BGGR, GRBG, GBRG]
                  default: AUTO
                  description: AUTO uses camera/driver CFA metadata when available; an explicit pattern works as a camera-neutral fallback.
                recordSer:
                  type: boolean
                  default: false
                  description: Record raw pre-debayer Live View frames to uncompressed SER and write a same-basename human-readable .txt metadata sidecar.
                serPath:
                  type: string
                  description: Optional node-local SER output path; defaults under Pictures/OpenAstroLink/SER.
                roi:
                  type: object
                  description: Optional hardware ROI in binned sensor coordinates.
                  properties:
                    x: { type: integer, minimum: 0 }
                    y: { type: integer, minimum: 0 }
                    width: { type: integer, minimum: 1 }
                    height: { type: integer, minimum: 1 }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /frames/{id}/preview:
    get:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      summary: Fetch PNG preview for a recently captured frame
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Success' }
  /solve:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hintRaDeg: { type: number, minimum: 0, maximum: 360 }
                hintDecDeg: { type: number, minimum: -90, maximum: 90 }
                hintFovDeg: { type: number, exclusiveMinimum: 0 }
                searchRadiusDeg: { type: number, exclusiveMinimum: 0 }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /solve/adaptive:
    post:
      summary: Start node-local adaptive short-exposure plate solve
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseExposureSec: { type: number, exclusiveMinimum: 0, default: 1.5 }
                gain: { type: integer, default: 0 }
                binX: { type: integer, minimum: 1, default: 2 }
                binY: { type: integer, minimum: 1, default: 2 }
                maxAttempts: { type: integer, minimum: 1, maximum: 6, default: 3 }
                stackFrames: { type: integer, minimum: 2, maximum: 9, default: 3 }
                finalStackFrames: { type: integer, minimum: 2, maximum: 15, default: 5 }
                minStarsForSolve: { type: integer, minimum: 4, default: 20 }
                exposureGrowth: { type: number, minimum: 1, default: 1.35 }
                maxSingleExposureSec: { type: number, exclusiveMinimum: 0, default: 3.0 }
                maxCapturePhaseSec: { type: number, minimum: 15, maximum: 600, default: 120.0 }
                registerFrames: { type: boolean, default: true }
                equalizeBackground: { type: boolean, default: true }
                useMountHint: { type: boolean, default: true }
                hintRaDeg: { type: number, minimum: 0, maximum: 360 }
                hintDecDeg: { type: number, minimum: -90, maximum: 90 }
                hintFovDeg: { type: number, exclusiveMinimum: 0 }
                searchRadiusDeg: { type: number, exclusiveMinimum: 0, default: 20 }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /autofocus/{id}/run:
    post:
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutofocusRequest' }
      responses: { '202': { $ref: '#/components/responses/Success' } }
  /motion/estimate:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /observer/system-location:
    post: { responses: { '202': { $ref: '#/components/responses/Success' } } }
  /guider/default/start:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /guider/default/stop:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /guider/default/update:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /guider/default/status:
    get: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /polar-align/clear:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /polar-align/sample:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /polar-align/ra-offset:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deltaDeg]
              properties: { deltaDeg: { type: number } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /polar-align/estimate:
    get: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /sessions:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /sessions/current:
    get: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /sessions/current/plan:
    get:
      summary: Return the currently loaded ObservationPlan
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /sessions/current/stop:
    post: { responses: { '200': { $ref: '#/components/responses/Success' } } }
  /mounts/{id}/manual-slew:
    post:
      summary: Start/stop ASCOM-style two-axis manual mount motion
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                axis1Direction: { type: integer, minimum: -1, maximum: 1 }
                axis2Direction: { type: integer, minimum: -1, maximum: 1 }
                rateLevel: { type: integer, minimum: 0, maximum: 9 }
      responses:
        '200': { description: Manual motion command accepted }
components:
  parameters:
    OperationId:
      in: path
      name: id
      required: true
      schema: { type: string }
    DeviceId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    EquatorialCoord:
      type: object
      required: [raDeg, decDeg]
      properties:
        raDeg: { type: number, minimum: 0, maximum: 360 }
        decDeg: { type: number, minimum: -90, maximum: 90 }
        coordinateFrame:
          type: string
          enum: [J2000, JNOW]
          default: J2000
          description: Equatorial coordinate frame. J2000 is the canonical OAL interchange frame; JNOW is converted to J2000 by the node.
    MountGeometry:
      type: object
      properties:
        type:
          type: string
          enum: [german-equatorial, fork-equatorial, alt-azimuth, alt-azimuth-derotator, equatorial-platform, custom-two-axis]
          default: german-equatorial
        axis1Sign: { type: integer, enum: [-1, 1], default: 1 }
        axis2Sign: { type: integer, enum: [-1, 1], default: 1 }
        preferredPierSide: { type: string, enum: [east, west], default: east }
        homeAxis1Deg: { type: number, default: 0 }
        homeAxis2Deg: { type: number, default: 0 }
        customHome: { type: boolean, default: false }
        autoHomeSync: { type: boolean, default: false }
        homeToleranceDeg: { type: number, minimum: 0.1, maximum: 15, default: 2 }
        parkAxis1Deg: { type: number, default: 0 }
        parkAxis2Deg: { type: number, default: 0 }
        customPark: { type: boolean, default: false }
        allowAutomaticPierFlip: { type: boolean, default: false }
        nativeCoordinateModelVersion:
          type: integer
          default: 1
          description: Direct Motor Controller coordinate-model ABI. v4 exposes one mechanical axis system with standard Home/Park Axis1=0°, Axis2=0°; controller step-count references remain transport details.
        preferBackendSite:
          type: boolean
          default: true
          description: For ASCOM, adopt a valid site reported by the mount backend into the OAL profile instead of maintaining a second independent observatory location.
        maxGotoSkyDeltaDeg:
          type: number
          minimum: 0.1
          maximum: 180
          default: 15
          description: Preferred v0.2.10.45+ name. Maximum true angular sky separation for one native coordinate GOTO; raw motor motion can be larger near the celestial pole.
        maxGotoAxisDeltaDeg:
          type: number
          minimum: 0.1
          maximum: 180
          default: 15
          deprecated: true
          description: Legacy wire/settings alias for maxGotoSkyDeltaDeg. Kept for compatibility; no longer means a raw motor-axis delta.
    TelescopeProfile:
      type: object
      properties:
        name: { type: string }
        opticalDesign: { type: string }
        apertureMm: { type: number }
        centralObstructionMm: { type: number }
        focalLengthMm: { type: number }
        pixelSizeUm: { type: number }
        sensorWidthPx: { type: integer }
        sensorHeightPx: { type: integer }
        observer:
          type: object
          properties:
            latitudeDeg: { type: number, minimum: -90, maximum: 90 }
            longitudeDeg: { type: number, minimum: -180, maximum: 180 }
            elevationM: { type: number }
        mountGeometry: { $ref: '#/components/schemas/MountGeometry' }
    ExposureRequest:
      type: object
      properties:
        exposureSec: { type: number, exclusiveMinimum: 0, default: 1 }
        binX: { type: integer, minimum: 1, default: 1 }
        binY: { type: integer, minimum: 1, default: 1 }
        gain: { type: integer, default: 0 }
        offset: { type: integer, default: 0 }
        saveRaw:
          type: boolean
          default: false
          description: Preserve a science/original file for this user capture when the camera/data plane supports it. Native host-frame cameras such as QHY are spooled by the node to FITS.
        savePath:
          type: string
          description: Optional destination file or directory. If omitted, the node uses its Pictures/OpenAstroLink/<vendor>/ science spool.
        includeImage: { type: boolean, default: true }
    AutofocusRequest:
      type: object
      properties:
        mode: { type: string, enum: [stars, scene, planet, bahtinov], default: stars }
        rangeSteps: { type: integer, minimum: 100, default: 1600 }
        coarseStep: { type: integer, minimum: 1, default: 200 }
        fineStep: { type: integer, minimum: 1, default: 40 }
        framesPerPosition: { type: integer, minimum: 1, default: 3 }
        settleMs: { type: integer, minimum: 0, default: 400 }
        autoPlanetRoi: { type: boolean, default: true }
        exposureSec: { type: number, exclusiveMinimum: 0, default: 0.05 }
        gain: { type: integer, minimum: 0, default: 0 }
        minStars: { type: integer, minimum: 1, default: 3 }
    SessionRequest:
      type: object
      required: [name]
      description: >-
        v0.2.10.47 accepts mixed DSO FITS/RAW and autonomous planetary SER
        ObservationPlan `blocks`. Legacy `targets` remains accepted and is converted
        to DSO FITS blocks. At least
        one of `blocks` or `targets` must contain an item.
      properties:
        id: { type: string }
        name: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ObservationBlock' }
        targets:
          type: array
          deprecated: true
          items:
            type: object
            required: [name, raDeg, decDeg]
            properties:
              name: { type: string }
              raDeg: { type: number }
              decDeg: { type: number }
              coordinateFrame: { type: string, enum: [J2000, JNOW], default: J2000 }
              exposureSec: { type: number, default: 30 }
              repeats: { type: integer, default: 1 }
              filter: { type: string }
    ObservationBlock:
      type: object
      required: [name, raDeg, decDeg, mode]
      properties:
        id: { type: string }
        name: { type: string }
        raDeg: { type: number }
        decDeg: { type: number, minimum: -90, maximum: 90 }
        coordinateFrame: { type: string, enum: [J2000, JNOW], default: J2000 }
        mode: { type: string, enum: [dso-fits, planetary-ser] }
        dso: { $ref: '#/components/schemas/DsoFitsBlock' }
        planetary:
          $ref: '#/components/schemas/PlanetarySerBlock'
    PlanetarySerBlock:
      type: object
      description: >-
        Autonomous high-speed planetary block. The node performs full-frame acquisition,
        planet detection, optional planetary autofocus, fixed-size hardware ROI SER capture,
        ROI tracking/provenance and optional calibrated slow mount corrections.
      properties:
        serRuns: { type: integer, minimum: 1, default: 1 }
        durationSec: { type: number, minimum: 0.5, default: 120 }
        pauseSec: { type: number, minimum: 0, default: 2 }
        trackingRate: { type: string, enum: [sidereal, lunar, solar], default: sidereal }
        stream:
          type: object
          properties:
            exposureSec: { type: number, minimum: 0.00005, default: 0.005 }
            gain: { type: integer, minimum: 0, default: 100 }
            offset: { type: integer, minimum: 0, default: 0 }
            binX: { type: integer, minimum: 1, default: 1 }
            binY: { type: integer, minimum: 1, default: 1 }
            targetFps: { type: number, minimum: 0.2, default: 100 }
            debayer: { type: boolean, default: false }
            bayerPattern: { type: string, enum: [AUTO, RGGB, BGGR, GRBG, GBRG], default: AUTO }
        roi:
          type: object
          properties:
            x: { type: integer, minimum: 0, default: 0 }
            y: { type: integer, minimum: 0, default: 0 }
            width: { type: integer, minimum: 0, default: 640, description: 0 selects automatic width }
            height: { type: integer, minimum: 0, default: 480, description: 0 selects automatic height }
        autofocus:
          type: object
          properties:
            beforeFirstRun: { type: boolean, default: true }
            everyNRuns: { type: integer, minimum: 0, default: 0 }
            rangeSteps: { type: integer, default: 1200 }
            coarseStep: { type: integer, default: 160 }
            fineStep: { type: integer, default: 32 }
            framesPerPosition: { type: integer, default: 3 }
            settleMs: { type: integer, default: 300 }
            exposureSec: { type: number, default: 0.01 }
            gain: { type: integer, default: 100 }
        tracking:
          type: object
          properties:
            allowRoiShift: { type: boolean, default: true }
            roiShiftThresholdPx: { type: integer, minimum: 4, default: 48 }
            mountCorrections: { type: boolean, default: false }
            mountCorrectionThresholdPx: { type: integer, minimum: 8, default: 140 }
            autoCalibrateMount: { type: boolean, default: true }
            calibrationArcsec: { type: number, minimum: 1, default: 20 }
            maxMountCorrectionArcsec: { type: number, minimum: 1, default: 30 }
            mountSettleMs: { type: integer, minimum: 0, default: 700 }
            lostTargetFrames: { type: integer, minimum: 1, default: 8 }
    DsoFitsBlock:
      type: object
      required: [exposure, frameCount]
      properties:
        exposure: { $ref: '#/components/schemas/ExposureRequest' }
        frameCount: { type: integer, minimum: 1, default: 1 }
        filter: { type: string }
        recenter:
          type: object
          properties:
            beforeFirstFrame: { type: boolean, default: true }
            everyNFrames: { type: integer, minimum: 0, default: 0 }
            toleranceArcmin: { type: number, minimum: 0.1, default: 2.0 }
            maxAttempts: { type: integer, minimum: 0, maximum: 10, default: 2 }
            solveExposureSec: { type: number, exclusiveMinimum: 0, default: 1.0 }
        autofocus:
          type: object
          properties:
            beforeFirstFrame: { type: boolean, default: true }
            everyNFrames: { type: integer, minimum: 0, default: 0 }
            mode: { type: string, enum: [stars, scene, planet, bahtinov], default: stars }
            rangeSteps: { type: integer, default: 1600 }
            coarseStep: { type: integer, default: 200 }
            fineStep: { type: integer, default: 40 }
            framesPerPosition: { type: integer, default: 3 }
            settleMs: { type: integer, default: 400 }
            exposureSec: { type: number, default: 0.05 }
            gain: { type: integer, default: 0 }
            minStars: { type: integer, default: 3 }
    Operation:
      type: object
      required: [id, kind, state, progress, cancelSupported, resourceLocks]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        phase: { type: string }
        cancelSupported: { type: boolean }
        cancelRequested: { type: boolean }
        resourceLocks:
          type: array
          items: { type: string }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
        startedAtUtc: { type: string, format: date-time }
        finishedAtUtc: { type: string, format: date-time }
        progressDetail: { type: object }
        result: {}
        problem:
          oneOf:
            - type: 'null'
            - type: object
    Envelope:
      type: object
      required: [ok, error, data]
      properties:
        ok: { type: boolean }
        error:
          oneOf:
            - type: 'null'
